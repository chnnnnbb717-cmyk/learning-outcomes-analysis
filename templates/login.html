{% extends "base.html" %}
{% block title %}登入｜學習成果分析網{% endblock %}
{% block content %}
<section class="login-card">
  <div class="logo">📊</div>
  <h1>學習成果分析網</h1>
  <p class="muted">Learning Outcomes Analysis Platform</p>
  <form method="post">
    <label>登入身分</label>
    <select name="role" required>
      <option value="teacher">教師</option>
      <option value="student">學生</option>
    </select>
    <label>帳號</label>
    <input name="username" autocomplete="username" placeholder="請輸入帳號" required>
    <label>密碼</label>
    <input type="password" name="password" autocomplete="current-password" placeholder="請輸入密碼" required>
    <label class="remember"><input type="checkbox" name="remember"> 記住我，保持登入 30 天</label>
    <button class="primary full" type="submit">登入系統</button>
  </form>
  <div class="demo">
    <b>測試帳號</b><br>
    教師：teacher / teacher123<br>
    學生：student01 / student123
  </div>
</section>
{% endblock %}
